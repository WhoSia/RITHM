name: RITHM S02.14-E3 frozen TNEG execution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s02-14-e3.yml'
      - 'scripts/s02_14_compile_frame.py'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frame:
    name: Reconstruct frozen S02.14 frame from exact MoST source bytes
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact MoST demand authority
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/lcodeca/MoSTScenario.git most-source
          git -C most-source checkout --detach b29b2f65f1096a9c69a601ec62a724815cb4a43f
          test "$(git -C most-source rev-parse HEAD)" = 'b29b2f65f1096a9c69a601ec62a724815cb4a43f'
          test "$(git -C most-source hash-object scenario/in/route/most.buses.flows.xml)" = 'd40c61978b3905d26fba2fc34ad589e22372d255'
          test "$(git -C most-source hash-object scenario/in/route/most.commercial.rou.xml)" = '8395d7c3b4239b1d0c0ab7fb53ee1d1e6f5627a1'
          test "$(git -C most-source hash-object scenario/in/route/most.highway.flows.xml)" = '4de691732a3422125789c5de465af26e76a8247d'
          test "$(git -C most-source hash-object scenario/in/route/most.pedestrian.rou.xml)" = '8207662a58ceccd932fd11715ffdae7df39dec25'
          test "$(git -C most-source hash-object scenario/in/route/most.special.rou.xml)" = '4cc76e02bb462551f191c0ad4c325a28d17bdf50'
          test "$(git -C most-source hash-object scenario/in/route/most.trains.flows.xml)" = '9888bea419cd8c78350380786df0c1dcbeb2062c'
          mkdir demand
          cp most-source/scenario/in/route/{most.buses.flows.xml,most.commercial.rou.xml,most.highway.flows.xml,most.pedestrian.rou.xml,most.special.rou.xml,most.trains.flows.xml} demand/

      - name: Reconstruct and verify exact frozen frame/cohorts
        run: |
          set -euo pipefail
          python scripts/s02_14_compile_frame.py --demand-dir demand --out-dir seal
          test "$(sha256sum seal/s02-14-demand-frame.tsv | cut -d' ' -f1)" = 'ad718af789d1402b2d809bbf0c0fa2b5786c71675a4c81ebf91bcd03a957022d'
          test "$(sha256sum seal/s02-14-eligible-frame.tsv | cut -d' ' -f1)" = 'e62c94e400e4e868c8ec2d3f734801c56dd0ba03fa2c050f32e223e876c43293'
          test "$(sha256sum seal/s02-14-p000-explicit.txt | cut -d' ' -f1)" = 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
          test "$(sha256sum seal/s02-14-p030-explicit.txt | cut -d' ' -f1)" = '1b9fba0675825b770afe24159fc39c4ba12b6f78fa05e432d77ad8e7556f83f5'
          test "$(sha256sum seal/s02-14-p070-explicit.txt | cut -d' ' -f1)" = 'f4855d4965e9d7268f97a2d0c90f11b4d9632cd6cd8d22ff2d15ed4804cd9270'
          test "$(sha256sum seal/s02-14-p100-explicit.txt | cut -d' ' -f1)" = '21d0db278e7c39d9403520b10ab471470a03c30cd908c587677a1d5249f8f634'

      - name: Upload frozen frame receipt
        uses: actions/upload-artifact@v4
        with:
          name: s02-14-e3-frozen-frame
          path: seal/
          if-no-files-found: error
          retention-days: 90

  build:
    name: Exact SUMO 1.14.0 GDAL build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ git libxerces-c-dev libgdal-dev libproj-dev zlib1g

      - name: Build exact v1_14_0
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1_14_0 https://github.com/eclipse-sumo/sumo.git sumo-src
          test "$(git -C sumo-src rev-parse HEAD)" = '58abfe34cdaf638c696ebd4d3660934f061ad94a'
          cmake -S sumo-src -B sumo-build -DCMAKE_BUILD_TYPE=Release
          cmake --build sumo-build --target sumo -j2
          sumo-src/bin/sumo --version | tee sumo-version.txt
          grep -Eiq 'Version[[:space:]]+1\.14\.0([^0-9]|$)' sumo-version.txt
          grep -Eq 'GDAL' sumo-version.txt
          sha256sum sumo-src/bin/sumo | tee sumo-binary.sha256
          mkdir -p runtime/bin runtime/data
          cp sumo-src/bin/sumo runtime/bin/sumo
          cp -a sumo-src/data/. runtime/data/
          cp sumo-version.txt sumo-binary.sha256 runtime/

      - name: Upload immutable runtime
        uses: actions/upload-artifact@v4
        with:
          name: s02-14-e3-sumo114-gdal-runtime
          path: runtime/
          if-no-files-found: error
          retention-days: 90

  cell:
    name: TNEG-p${{ matrix.label }}
    needs: [frame, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: '000'
            cohort_file: s02-14-p000-explicit.txt
            cohort_sha: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
            cohort_n: 0
          - label: '030'
            cohort_file: s02-14-p030-explicit.txt
            cohort_sha: 1b9fba0675825b770afe24159fc39c4ba12b6f78fa05e432d77ad8e7556f83f5
            cohort_n: 13746
          - label: '070'
            cohort_file: s02-14-p070-explicit.txt
            cohort_sha: f4855d4965e9d7268f97a2d0c90f11b4d9632cd6cd8d22ff2d15ed4804cd9270
            cohort_n: 32075
          - label: '100'
            cohort_file: s02-14-p100-explicit.txt
            cohort_sha: 21d0db278e7c39d9403520b10ab471470a03c30cd908c587677a1d5249f8f634
            cohort_n: 45822

    steps:
      - name: Install exact runtime libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git libxerces-c3.2 libgdal30 libproj22 zlib1g

      - name: Download exact SUMO runtime
        uses: actions/download-artifact@v4
        with:
          name: s02-14-e3-sumo114-gdal-runtime
          path: runtime

      - name: Download reconstructed frozen frame
        uses: actions/download-artifact@v4
        with:
          name: s02-14-e3-frozen-frame
          path: seal

      - name: Verify runtime and frozen frame/cohort receipt
        run: |
          set -euo pipefail
          chmod +x runtime/bin/sumo
          export SUMO_HOME="$PWD/runtime"
          runtime/bin/sumo --version | tee cell-sumo-version.txt
          grep -Eiq 'Version[[:space:]]+1\.14\.0([^0-9]|$)' cell-sumo-version.txt
          grep -Eq 'GDAL' cell-sumo-version.txt
          test "$(sha256sum runtime/bin/sumo | cut -d' ' -f1)" = "$(cut -d' ' -f1 runtime/sumo-binary.sha256)"
          test "$(sha256sum seal/s02-14-eligible-frame.tsv | cut -d' ' -f1)" = 'e62c94e400e4e868c8ec2d3f734801c56dd0ba03fa2c050f32e223e876c43293'
          test "$(sha256sum seal/${{ matrix.cohort_file }} | cut -d' ' -f1)" = '${{ matrix.cohort_sha }}'
          python - <<'PY'
          import csv
          with open('seal/s02-14-eligible-frame.tsv',newline='') as f:
              rows=list(csv.DictReader(f,delimiter='\t'))
          assert len(rows)==45822 and len({r['id'] for r in rows})==45822
          PY

      - name: Checkout exact MoST commit
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/lcodeca/MoSTScenario.git most
          git -C most checkout --detach b29b2f65f1096a9c69a601ec62a724815cb4a43f
          test "$(git -C most rev-parse HEAD)" = 'b29b2f65f1096a9c69a601ec62a724815cb4a43f'
          test "$(git -C most hash-object scenario/most.sumocfg)" = '03dbc535acd7057731a1de8924115a9276842426'
          test "$(git -C most hash-object scenario/in/most.net.xml)" = '6ffae75cfe63992c04a6395fbbe86cc39166140c'
          test "$(git -C most hash-object scenario/in/add/basic.vType.xml)" = 'd9aebbde5cfeb8dbee6203d6c5fdf3b1f4666a21'

      - name: Materialize frozen TNEG treatment config
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET, hashlib, json
          label='${{ matrix.label }}'
          cohort=[x for x in Path('seal/${{ matrix.cohort_file }}').read_text().splitlines() if x]
          assert len(cohort)==${{ matrix.cohort_n }} and len(set(cohort))==${{ matrix.cohort_n }}
          tree=ET.parse('most/scenario/most.sumocfg')
          root=tree.getroot()
          routing=root.find('routing')
          out=root.find('output')
          proc=root.find('processing')
          assert routing is not None and out is not None and proc is not None
          prefix=out.find('output-prefix')
          assert prefix is not None and prefix.get('value')=='most.'
          mdd=proc.find('max-depart-delay')
          assert mdd is not None and float(mdd.get('value'))==900.0

          def setv(parent,name,value):
              e=parent.find(name)
              if e is None:
                  e=ET.SubElement(parent,name)
              e.set('value',str(value))

          setv(routing,'device.rerouting.probability','0')
          setv(routing,'device.rerouting.period','300')
          setv(routing,'device.rerouting.pre-period','300')
          old=routing.find('device.rerouting.explicit')
          if old is not None:
              routing.remove(old)
          if cohort:
              e=ET.SubElement(routing,'device.rerouting.explicit')
              e.set('value',','.join(cohort))

          setv(proc,'time-to-teleport','-1')
          setv(out,'tripinfo-output',f'e3-p{label}-tripinfo.xml')
          setv(out,'tripinfo-output.write-unfinished','true')

          cfg=Path(f'most/scenario/e3-p{label}.sumocfg')
          tree.write(cfg,encoding='utf-8',xml_declaration=True)
          receipt={
              'stage':'RITHM-ORIGIN-S02.14-E3',
              'label':label,
              'cohort_n':len(cohort),
              'global_probability':0,
              'period':300,
              'pre_period':300,
              'time_to_teleport':-1,
              'max_depart_delay':900,
              'begin':14400,
              'end':50400,
              'step':0.25,
              'seed':42,
              'output_prefix':'most.',
              'tripinfo_configured_name':f'e3-p{label}-tripinfo.xml',
              'tripinfo_expected_realized_name':f'most.e3-p{label}-tripinfo.xml',
              'tripinfo_write_unfinished':True,
              'config_sha256':hashlib.sha256(cfg.read_bytes()).hexdigest(),
              'target_outcome_read_before_execution':False,
              'scientific_change_from_e2':'time-to-teleport:120->-1 only',
              'runner_timeout_minutes':360,
              'process_budget_minutes':345,
              'timeout_is_gridlock_evidence':False,
          }
          Path(f'e3-p{label}-config-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Exact parser round-trip and constitution gate
        working-directory: most/scenario
        env:
          SUMO_HOME: ${{ github.workspace }}/runtime
        run: |
          set -euo pipefail
          ../../runtime/bin/sumo -c e3-p${{ matrix.label }}.sumocfg -C e3-p${{ matrix.label }}.roundtrip.sumocfg
          test -s e3-p${{ matrix.label }}.roundtrip.sumocfg
          python - <<'PY'
          import xml.etree.ElementTree as ET
          label='${{ matrix.label }}'
          root=ET.parse(f'e3-p{label}.roundtrip.sumocfg').getroot()
          out=root.find('output')
          proc=root.find('processing')
          routing=root.find('routing')
          assert out is not None and proc is not None and routing is not None
          assert out.find('output-prefix').get('value')=='most.'
          assert out.find('tripinfo-output').get('value')==f'e3-p{label}-tripinfo.xml'
          assert out.find('tripinfo-output.write-unfinished').get('value').lower()=='true'
          assert float(proc.find('time-to-teleport').get('value'))==-1.0
          assert float(proc.find('max-depart-delay').get('value'))==900.0
          assert float(routing.find('device.rerouting.probability').get('value'))==0.0
          assert float(routing.find('device.rerouting.period').get('value'))==300.0
          assert float(routing.find('device.rerouting.pre-period').get('value'))==300.0
          explicit=routing.find('device.rerouting.explicit')
          expected=${{ matrix.cohort_n }}
          if expected==0:
              assert explicit is None or not explicit.get('value','')
          else:
              assert explicit is not None
              assert len([x for x in explicit.get('value','').split(',') if x])==expected
          PY

      - name: Execute frozen TNEG cell under external compute budget
        id: execute
        working-directory: most/scenario
        env:
          SUMO_HOME: ${{ github.workspace }}/runtime
        run: |
          set +e
          /usr/bin/time -v timeout --signal=TERM --kill-after=60s 345m ../../runtime/bin/sumo -c e3-p${{ matrix.label }}.sumocfg --no-step-log true > e3-p${{ matrix.label }}.stdout.txt 2> e3-p${{ matrix.label }}.stderr.txt
          rc=$?
          echo "$rc" > e3-p${{ matrix.label }}.exitcode.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prefix-aware complete TripInfo custody gate
        id: custody
        if: ${{ steps.execute.outputs.rc == '0' }}
        run: |
          set -euo pipefail
          test -s most/scenario/most.e3-p${{ matrix.label }}-tripinfo.xml
          sha256sum most/scenario/most.e3-p${{ matrix.label }}-tripinfo.xml > e3-p${{ matrix.label }}-tripinfo.sha256
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Materialize frame-complete per-ID TNEG burden receipt without cell mean
        if: ${{ steps.custody.outputs.ok == 'true' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv, math, xml.etree.ElementTree as ET
          label='${{ matrix.label }}'
          H=50400.0
          frame={}
          with open('seal/s02-14-eligible-frame.tsv',newline='') as f:
              for row in csv.DictReader(f,delimiter='\t'):
                  frame[row['id']]=float(row['activation_time'])
          assert len(frame)==45822
          trip=Path(f'most/scenario/most.e3-p{label}-tripinfo.xml')
          assert trip.exists() and trip.stat().st_size>0
          arrivals={}
          duplicates=[]
          for _,e in ET.iterparse(trip,events=('end',)):
              if e.tag.split('}')[-1]!='tripinfo':
                  e.clear()
                  continue
              vid=e.attrib.get('id')
              if vid not in frame:
                  e.clear()
                  continue
              if vid in arrivals:
                  duplicates.append(vid)
              try:
                  a=float(e.attrib.get('arrival','-1'))
              except Exception:
                  a=-1.0
              arrivals[vid]=a if math.isfinite(a) and 0<=a<=H else H
              e.clear()
          assert not duplicates, duplicates[:20]
          with open(f'e3-p{label}-framecomplete.tsv','w',newline='') as f:
              w=csv.writer(f,delimiter='\t')
              w.writerow(['id','activation_time','completion_clock','burden','status'])
              for vid,s in frame.items():
                  if vid in arrivals:
                      A=arrivals[vid]
                      status='materialized'
                  else:
                      A=H
                      status='absent'
                  b=A-s
                  assert b>=-1e-9
                  w.writerow([vid,s,A,b,status])
          PY
          test "$(($(wc -l < e3-p${{ matrix.label }}-framecomplete.tsv)-1))" = '45822'

      - name: Seal cell execution/custody status
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          label='${{ matrix.label }}'
          ep=Path(f'most/scenario/e3-p{label}.exitcode.txt')
          rc=int(ep.read_text().strip()) if ep.exists() else None
          trip=Path(f'most/scenario/most.e3-p{label}-tripinfo.xml')
          frame=Path(f'e3-p{label}-framecomplete.tsv')
          out={
              'stage':'RITHM-ORIGIN-S02.14-E3',
              'label':label,
              'exit_code':rc,
              'simulation_success':rc==0,
              'process_budget_exhausted':rc in {124,137},
              'prefixed_tripinfo_custodied':trip.exists() and trip.stat().st_size>0,
              'framecomplete_materialized':frame.exists() and frame.stat().st_size>0,
              'scientific_cell_receipt_valid':rc==0 and trip.exists() and trip.stat().st_size>0 and frame.exists() and frame.stat().st_size>0,
              'cell_mean_computed':False,
              'target_curvature_scored':False,
              'runner_timeout_minutes':360,
              'process_budget_minutes':345,
              'timeout_is_gridlock_evidence':False,
          }
          if trip.exists():
              out['tripinfo_sha256']=hashlib.sha256(trip.read_bytes()).hexdigest()
          Path(f'e3-p{label}-status.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Upload cell receipt regardless of scientific evaluability
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s02-14-e3-p${{ matrix.label }}
          path: |
            cell-sumo-version.txt
            e3-p${{ matrix.label }}-config-receipt.json
            e3-p${{ matrix.label }}-status.json
            e3-p${{ matrix.label }}-framecomplete.tsv
            e3-p${{ matrix.label }}-tripinfo.sha256
            most/scenario/e3-p${{ matrix.label }}.roundtrip.sumocfg
            most/scenario/e3-p${{ matrix.label }}.exitcode.txt
            most/scenario/e3-p${{ matrix.label }}.stdout.txt
            most/scenario/e3-p${{ matrix.label }}.stderr.txt
            most/scenario/most.e3-p${{ matrix.label }}-tripinfo.xml
          if-no-files-found: warn
          retention-days: 90

      - name: Fail cell only after receipt custody
        if: always()
        run: |
          test "$(cat most/scenario/e3-p${{ matrix.label }}.exitcode.txt)" = '0'
          test -s most/scenario/most.e3-p${{ matrix.label }}-tripinfo.xml
          test -s e3-p${{ matrix.label }}-framecomplete.tsv

  score:
    name: Complete-set frozen TNEG curvature and regularization closure
    needs: cell
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Download all available fresh E3 cell receipts
        uses: actions/download-artifact@v4
        with:
          pattern: s02-14-e3-p*
          path: cells
          merge-multiple: false

      - name: Admission before any target aggregation
        id: admission
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, os
          labels=['000','030','070','100']
          statuses={}
          ok=True
          for label in labels:
              d=Path('cells')/f's02-14-e3-p{label}'
              sp=d/f'e3-p{label}-status.json'
              if not sp.exists():
                  statuses[label]={'scientific_cell_receipt_valid':False,'reason':'missing-status'}
                  ok=False
                  continue
              statuses[label]=json.loads(sp.read_text())
              fp=d/f'e3-p{label}-framecomplete.tsv'
              tp=d/'most'/'scenario'/f'most.e3-p{label}-tripinfo.xml'
              if not statuses[label].get('scientific_cell_receipt_valid') or not fp.exists() or not tp.exists():
                  ok=False
          out={
              'stage':'RITHM-ORIGIN-S02.14-E3',
              'all_four_fresh_e3_cells_valid':ok,
              'target_aggregation_permitted':ok,
              'statuses':statuses,
              'timeout_is_gridlock_evidence':False,
          }
          Path('e3-admission.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"ok={'true' if ok else 'false'}\n")
          PY

      - name: Apply frozen TNEG decision and closure rule
        if: ${{ steps.admission.outputs.ok == 'true' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv, json
          labels=['000','030','070','100']
          B={}
          counts={}
          for label in labels:
              fp=Path('cells')/f's02-14-e3-p{label}'/f'e3-p{label}-framecomplete.tsv'
              total=0.0
              n=0
              materialized=0
              absent=0
              with fp.open(newline='') as f:
                  for row in csv.DictReader(f,delimiter='\t'):
                      total+=float(row['burden'])
                      n+=1
                      if row['status']=='materialized':
                          materialized+=1
                      elif row['status']=='absent':
                          absent+=1
              assert n==45822
              B[label]=total/45822
              counts[label]={'materialized_n':materialized,'absent_n':absent,'frame_n':n}
          B0=B['000']
          assert B0>0
          R={k:B[k]/B0-1 for k in labels}
          C=(R['100']-R['070'])-(R['030']-R['000'])
          eps=.005
          if C>eps:
              tneg_verdict='PASS-TNEG-CURVATURE'
              closure='PASS-TELEPORT-ROBUST'
          elif C<-eps:
              tneg_verdict='DEFEAT-TNEG-CURVATURE'
              closure='REGULARIZATION-SENSITIVE'
          else:
              tneg_verdict='UNRESOLVED-TNEG-CURVATURE'
              closure='REGULARIZATION-SENSITIVE'
          out={
              'stage':'RITHM-ORIGIN-S02.14-E3',
              'scientific_target_observed':True,
              'B_NEG':B,
              'R_B_NEG':R,
              'C_B_NEG':C,
              'epsilon':eps,
              'counts':counts,
              'tneg_verdict':tneg_verdict,
              'closure':closure,
              'e2_t120_verdict':'PASS-FRESH-FRAME-COMPLETE-CURVATURE-RECOURT',
              'e2_C_B':0.028238190134892482,
              'no_post_reveal_retuning':True,
              'timeout_is_gridlock_evidence':False,
          }
          Path('s02-14-e3-final.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Seal execution HOLD without reading target aggregation
        if: ${{ steps.admission.outputs.ok != 'true' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          admission=json.loads(Path('e3-admission.json').read_text())
          out={
              'stage':'RITHM-ORIGIN-S02.14-E3',
              'scientific_target_observed':False,
              'B_NEG':None,
              'R_B_NEG':None,
              'C_B_NEG':None,
              'tneg_verdict':'HOLD-EXECUTION / TNEG-NONMATERIALIZED',
              'closure':'E2-VALID-CANONICAL-T120-ONLY / NO-TELEPORT-ROBUSTNESS-CLAIM',
              'admission':admission,
