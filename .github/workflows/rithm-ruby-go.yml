name: RITHM Ruby-Go Certificate Gate
on:
  push:
    paths:
      - 'ruby/rithm28/**'
      - 'ruby/rithm29/**'
      - 'go/rithm29/**'
      - 'scripts/rithm29-p0-independent.sh'
      - 'go/rithm28/**'
      - 'scripts/rithm28-ruby-go-check.sh'
      - 'scripts/rithm28-p1p11-typed-evidence.sh'
      - 'scripts/rithm28-p1p11-linked-evidence.sh'
      - '.github/workflows/rithm-ruby-go.yml'
  pull_request:
    paths:
      - 'ruby/rithm28/**'
      - 'go/rithm28/**'
      - 'scripts/rithm28-ruby-go-check.sh'
      - 'scripts/rithm28-p1p11-typed-evidence.sh'
      - 'scripts/rithm28-p1p11-linked-evidence.sh'
      - '.github/workflows/rithm-ruby-go.yml'
  workflow_dispatch:
jobs:
  certificate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Ruby synthesis and independent Go replay
        run: bash scripts/rithm28-ruby-go-check.sh
      - name: P1-P10 observation equivalence and provenance separation
        run: |
          ruby ruby/rithm28/p1p10/test_audit.rb
          go run go/rithm28/p1p10/independent.go
      - name: P1-P11 typed receipt and delivery integrity
        run: bash scripts/rithm28-p1p11-typed-evidence.sh
      - name: P1-P11 linked-evidence ancestry and re-signed mutation audit
        run: bash scripts/rithm28-p1p11-linked-evidence.sh
      - name: P1-P12 independently checked two-root compositional welfare gate
        run: ruby ruby/rithm28/p1p12/test.rb
      - name: P1-P18 Ruby composition court (P2 promotion HOLD)
        run: ruby ruby/rithm28/p1p18/test_composition_court.rb
      - name: P1-P18 deadline prefix lower-bound versus Ruby exhaustive scheduling
        run: ruby ruby/rithm28/p1p18/test_prefix_bound.rb
      - name: P1-P18 temporal revocation dual certificate proof and mutation gate
        run: bash scripts/rithm28-p1p18-dual-revocation.sh
      - name: P1-P18 Ruby free-information refinement consistency
        run: ruby ruby/rithm28/p1p18/test_refinement.rb
      - name: Private-source preflight regression on synthetic fixtures only
        run: ruby ruby/rithm28/test_source_preflight.rb
      - name: P1-P19 Ruby-Go route cost forecast rank-reversal court
        run: bash scripts/rithm28-p1p19-route-cost-court.sh

      - name: P1-P19 dynamic synthetic feedback regression
        run: ruby ruby/rithm28/p1p19/test_effort_dynamics.rb
      - name: P1-P20 separated deliberation and switching synthetic court
        run: ruby ruby/rithm28/p1p20/test_deliberation_court.rb
      - name: Finite hidden-state inspection test
        run: ruby ruby/rithm28/p1p20/test_bayes_inspection.rb
      - name: P1-P21 shared-signal costly-attention counterexample
        run: ruby ruby/rithm28/p1p21/test_shared_signal.rb

      - name: P1-P22 contingent Bayesian pure Nash audit
        run: ruby ruby/rithm28/p1p22/test_strategic_inspection.rb
      - name: P1-P23 three-agent pure contingent equilibrium and depth screen
        run: ruby ruby/rithm28/p1p23/test_three_agent.rb
      - name: P1-P24 exact three-agent information-price equilibrium frontier
        run: ruby ruby/rithm28/p1p24/test_price_frontier.rb
      - name: P1-P25 exact price breakpoints and bounded mixed subgame
        run: ruby ruby/rithm28/p1p25/test_exact_frontier.rb
      - name: P1-P25 finite instruction budget and nonmyopic metareasoning
        run: ruby ruby/rithm28/p1p25/test_finite_procedure.rb
      - name: P1-P26 full three-agent exact mixed deviation court
        run: ruby ruby/rithm28/p1p26/test_full_mixed.rb
      - name: P1-P27 exact mixed equilibrium welfare identity
        run: ruby ruby/rithm28/p1p27/test_mixed_welfare.rb
      - name: P1-P27 repeated limited computation and refresh cost
        run: ruby ruby/rithm28/p1p27/test_repeated_compute.rb
      - name: RITHM-2.9 P0 finite paid-instruction strategic game
        run: ruby ruby/rithm29/p0/test_paid_agency.rb
      - name: RITHM-2.9 P0 independent Ruby-Go exact payoff comparison
        run: bash scripts/rithm29-p0-independent.sh
