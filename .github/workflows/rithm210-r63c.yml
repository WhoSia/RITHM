name: RITHM-2.10 R63C A4-Marginal and Sharp-Coupling Source-Free Gate

on:
  push:
    paths:
      - 'ruby/rithm210/p3/r63c_*.py'
      - 'ruby/rithm210/p3/test_r63c_*.py'
      - 'ruby/rithm210/p3/r63c_*.json'
      - '.github/workflows/rithm210-r63c.yml'
  pull_request:
    paths:
      - 'ruby/rithm210/p3/r63c_*.py'
      - 'ruby/rithm210/p3/test_r63c_*.py'
      - 'ruby/rithm210/p3/r63c_*.json'
      - '.github/workflows/rithm210-r63c.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-coupling-and-aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install same source-free R63C runtime dependencies
        run: python -m pip install -r ruby/rithm210/p3/requirements-r62.txt
      - name: Check exact 64-mask couplings and immutable human-derived aggregates (no original ZIP)
        run: python -m unittest discover -s ruby/rithm210/p3 -p 'test_r63c_*.py' -v
