name: RITHM S02.15 bounded teleport-mechanism probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s02-15-mechanism-probe.yml'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    name: S02.15-p${{ matrix.p }}-${{ matrix.regime }}
    runs-on: ubuntu-22.04
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - p: '000'
            regime: t120
            teleport: '120'
            cohort_file: s02-14-p000-explicit.txt
            cohort_sha: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
            cohort_n: 0
          - p: '000'
            regime: tneg
            teleport: '-1'
            cohort_file: s02-14-p000-explicit.txt
            cohort_sha: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
            cohort_n: 0
          - p: '100'
            regime: t120
            teleport: '120'
            cohort_file: s02-14-p100-explicit.txt
            cohort_sha: 21d0db278e7c39d9403520b10ab471470a03c30cd908c587677a1d5249f8f634
            cohort_n: 45822
          - p: '100'
            regime: tneg
            teleport: '-1'
            cohort_file: s02-14-p100-explicit.txt
            cohort_sha: 21d0db278e7c39d9403520b10ab471470a03c30cd908c587677a1d5249f8f634
            cohort_n: 45822

    steps:
      - uses: actions/checkout@v4

      - name: Install exact runtime libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxerces-c3.2 libgdal30 libproj22 zlib1g

      - name: Download exact E3 SUMO runtime
        uses: actions/download-artifact@v4
        with:
          name: s02-14-e3-sumo114-gdal-runtime
          path: runtime
          github-token: ${{ github.token }}
          repository: WhoSia/RITHM
          run-id: 35307642604

      - name: Download frozen S02.14 frame and cohorts
        uses: actions/download-artifact@v4
        with:
          name: s02-14-e3-frozen-frame
          path: seal
          github-token: ${{ github.token }}
          repository: WhoSia/RITHM
          run-id: 35307642604

      - name: Verify exact authority
        run: |
          set -euo pipefail
          chmod +x runtime/bin/sumo
          test "$(sha256sum runtime/bin/sumo | cut -d' ' -f1)" = '75c5556e52dd48953a7b6b75c3bb508df89a1e5690f7e32c962eac4587da864b'
          test "$(sha256sum seal/s02-14-eligible-frame.tsv | cut -d' ' -f1)" = 'e62c94e400e4e868c8ec2d3f734801c56dd0ba03fa2c050f32e223e876c43293'
          test "$(sha256sum seal/${{ matrix.cohort_file }} | cut -d' ' -f1)" = '${{ matrix.cohort_sha }}'
          runtime/bin/sumo --version | tee sumo-version.txt
          grep -Eiq 'Version[[:space:]]+1\.14\.0([^0-9]|$)' sumo-version.txt
          ! ldd runtime/bin/sumo | grep -q 'not found'

      - name: Checkout exact MoST authority
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/lcodeca/MoSTScenario.git most
          git -C most checkout --detach b29b2f65f1096a9c69a601ec62a724815cb4a43f
          test "$(git -C most rev-parse HEAD)" = 'b29b2f65f1096a9c69a601ec62a724815cb4a43f'
          test "$(git -C most hash-object scenario/most.sumocfg)" = '03dbc535acd7057731a1de8924115a9276842426'

      - name: Materialize bounded mechanism configuration
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET, hashlib, json
          p='${{ matrix.p }}'
          regime='${{ matrix.regime }}'
          teleport='${{ matrix.teleport }}'
          cohort=[x for x in Path('seal/${{ matrix.cohort_file }}').read_text().splitlines() if x]
          assert len(cohort)==${{ matrix.cohort_n }} and len(set(cohort))==${{ matrix.cohort_n }}

          tree=ET.parse('most/scenario/most.sumocfg')
          root=tree.getroot()
          routing=root.find('routing'); out=root.find('output')
          proc=root.find('processing'); time=root.find('time'); rnd=root.find('random_number')
          assert all(x is not None for x in (routing,out,proc,time,rnd))
          assert out.find('output-prefix').get('value')=='most.'
          assert float(time.find('begin').get('value'))==14400.0
          assert float(time.find('step-length').get('value'))==0.25
          assert int(rnd.find('seed').get('value'))==42
          assert float(proc.find('max-depart-delay').get('value'))==900.0

          def setv(parent,name,value):
              e=parent.find(name)
              if e is None:
                  e=ET.SubElement(parent,name)
              e.set('value',str(value))

          setv(time,'end','21600')
          setv(proc,'time-to-teleport',teleport)
          setv(routing,'device.rerouting.probability','0')
          setv(routing,'device.rerouting.period','300')
          setv(routing,'device.rerouting.pre-period','300')
          old=routing.find('device.rerouting.explicit')
          if old is not None:
              routing.remove(old)
          if cohort:
              e=ET.SubElement(routing,'device.rerouting.explicit')
              e.set('value',','.join(cohort))
          setv(out,'tripinfo-output',f's02-15-p{p}-{regime}-tripinfo.xml')
          setv(out,'tripinfo-output.write-unfinished','true')

          cfg=Path(f'most/scenario/s02-15-p{p}-{regime}.sumocfg')
          tree.write(cfg,encoding='utf-8',xml_declaration=True)
          receipt={
              'stage':'RITHM-ORIGIN-S02.15',
              'probe_role':'bounded mechanism discrimination; no burden target',
              'p':p,'regime':regime,'time_to_teleport':float(teleport),
              'begin':14400,'diagnostic_end':21600,'step':0.25,'seed':42,
              'max_depart_delay':900,'cohort_n':len(cohort),
              'output_prefix':'most.','summary_period':'every-step','queue_period':60,
              'B_opened':False,'R_B_opened':False,'C_B_opened':False,
              'config_sha256':hashlib.sha256(cfg.read_bytes()).hexdigest(),
              'sumo_binary_sha256':'75c5556e52dd48953a7b6b75c3bb508df89a1e5690f7e32c962eac4587da864b'
          }
          Path('config-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Parser and observation-surface preflight
        working-directory: most/scenario
        env:
          SUMO_HOME: ${{ github.workspace }}/runtime
        run: |
          set -euo pipefail
          ../../runtime/bin/sumo -c s02-15-p${{ matrix.p }}-${{ matrix.regime }}.sumocfg -C roundtrip.sumocfg
          test -s roundtrip.sumocfg
          ../../runtime/bin/sumo --help > help.txt
          grep -q -- '--summary-output' help.txt
          grep -q -- '--queue-output.period' help.txt

      - name: Execute bounded paired mechanism probe
        id: execute
        working-directory: most/scenario
        env:
          SUMO_HOME: ${{ github.workspace }}/runtime
        run: |
          set +e
          start=$(date +%s)
          timeout --signal=INT --kill-after=30s 9000s             ../../runtime/bin/sumo               -c s02-15-p${{ matrix.p }}-${{ matrix.regime }}.sumocfg               --no-step-log true               --summary-output probe-summary.xml               --queue-output probe-queue.xml               --queue-output.period 60               --statistic-output probe-statistic.xml               > stdout.txt 2> stderr.txt
          rc=$?
          end=$(date +%s)
          echo "$rc" > exitcode.txt
          echo "$((end-start))" > runtime-seconds.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Seal mechanism-probe status
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, shutil
          p='${{ matrix.p }}'; regime='${{ matrix.regime }}'
          base=Path('most/scenario')
          rcfile=base/'exitcode.txt'
          rc=int(rcfile.read_text().strip()) if rcfile.exists() else None
          mapping={
              base/'stderr.txt':Path('stderr.txt'),
              base/'stdout.txt':Path('stdout.txt'),
              base/'runtime-seconds.txt':Path('runtime-seconds.txt'),
              base/'most.probe-summary.xml':Path('summary.xml'),
              base/'most.probe-queue.xml':Path('queue.xml'),
              base/'most.probe-statistic.xml':Path('statistic.xml'),
              base/f'most.s02-15-p{p}-{regime}-tripinfo.xml':Path('tripinfo.xml'),
          }
          for src,dst in mapping.items():
              if src.exists():
                  shutil.copy2(src,dst)
          required=[Path('stderr.txt'),Path('summary.xml'),Path('queue.xml'),Path('tripinfo.xml')]
          valid=rc==0 and all(x.exists() and x.stat().st_size>0 for x in required)
          out={
              'stage':'RITHM-ORIGIN-S02.15','p':p,'regime':regime,
              'exit_code':rc,'execution_valid':valid,
              'process_timeout_seconds':9000,
              'target_aggregation_opened':False,
              'B':None,'R_B':None,'C_B':None,
          }
          rt=Path('runtime-seconds.txt')
          if rt.exists(): out['runtime_seconds']=int(rt.read_text().strip())
          for f in required:
              if f.exists(): out[f'{f.stem}_sha256']=hashlib.sha256(f.read_bytes()).hexdigest()
          Path('status.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Upload bounded mechanism evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s02-15-${{ matrix.p }}-${{ matrix.regime }}
          path: |
            sumo-version.txt
            config-receipt.json
            status.json
            exitcode.txt
            runtime-seconds.txt
            stderr.txt
            stdout.txt
            summary.xml
            queue.xml
            statistic.xml
            tripinfo.xml
          if-no-files-found: warn
          retention-days: 90

      - name: Fail invalid execution after custody
        if: always()
        run: |
          python - <<'PY'
          import json
          s=json.load(open('status.json'))
          raise SystemExit(0 if s.get('execution_valid') else 1)
          PY

  adjudicate:
    name: S02.15 paired mechanism adjudication
    needs: probe
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all bounded probe artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: s02-15-*
          path: cells
          merge-multiple: false

      - name: Admit and compare without opening burden target
        run: |
          set -euo pipefail
          required=(s02-15-000-t120 s02-15-000-tneg s02-15-100-t120 s02-15-100-tneg)
          missing=0
          for d in "${required[@]}"; do
            test -f "cells/$d/status.json" || missing=1
          done
          if [ "$missing" = 1 ]; then
            python - <<'PY'
          import json
          json.dump({
            'stage':'RITHM-ORIGIN-S02.15',
            'verdict':'HOLD-MECHANISM-PROBE-ADMISSION',
            'reason':'one or more cell status artifacts missing',
            'target_aggregation_opened':False,'B':None,'R_B':None,'C_B':None
          },open('s02-15-mechanism-probe.json','w'),indent=2,sort_keys=True)
          PY
          else
            python scripts/s02_15_score_mechanism_probe.py               --cells cells               --out s02-15-mechanism-probe.json
          fi
          cat s02-15-mechanism-probe.json

      - name: Upload S02.15 mechanism receipt
        uses: actions/upload-artifact@v4
        with:
          name: s02-15-mechanism-probe-final
          path: s02-15-mechanism-probe.json
          if-no-files-found: error
          retention-days: 90