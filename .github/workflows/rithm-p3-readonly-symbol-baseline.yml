name: RITHM P3 Ruby read-only semantic baseline
on:
  push:
    branches: [main]
    paths:
      - 'ruby/rithm210/p3/readonly_symbol_inventory.rb'
      - 'ruby/rithm210/p3/test_readonly_symbol_inventory.rb'
      - 'ruby/rithm210/p3/occupancy_churn_bounds.rb'
      - 'ruby/rithm210/p3/test_occupancy_churn_bounds.rb'
      - 'ruby/rithm210/p3/mutation_sensitivity_review.rb'
      - 'ruby/rithm210/p3/friction_welfare.rb'
      - 'ruby/rithm210/p3/test_friction_welfare.rb'
      - 'ruby/rithm210/p3/turnover_coupling_witness.rb'
      - 'ruby/rithm210/p3/test_turnover_coupling_witness.rb'
      - '.github/workflows/rithm-p3-readonly-symbol-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - name: Ruby syntax check for fixed scientific examples
        run: |
          ruby -c ruby/rithm210/p3/readonly_symbol_inventory.rb
          ruby -c ruby/rithm210/p3/occupancy_churn_bounds.rb
          ruby -c ruby/rithm210/p3/friction_welfare.rb
          ruby -c ruby/rithm210/p3/turnover_coupling_witness.rb
      - name: Four fixed mutation-sensitivity cases in disposable directories
        run: ruby ruby/rithm210/p3/mutation_sensitivity_review.rb
      - name: Baseline Ruby symbol inventory versus fixed expected AST symbols
        run: ruby ruby/rithm210/p3/test_readonly_symbol_inventory.rb
      - name: Sharp occupancy bounds and resource-domain regression
        run: ruby ruby/rithm210/p3/test_occupancy_churn_bounds.rb
      - name: Micro-to-macro welfare exact rational regression
        run: ruby ruby/rithm210/p3/test_friction_welfare.rb
      - name: Nonidentified turnover-risk witness
        run: ruby ruby/rithm210/p3/test_turnover_coupling_witness.rb
      - name: All four P3 suites in a single Ruby process
        run: |
          ruby -I ruby/rithm210/p3 -e '
            %w[test_readonly_symbol_inventory test_occupancy_churn_bounds test_friction_welfare test_turnover_coupling_witness].each { |name| require name }
          '
