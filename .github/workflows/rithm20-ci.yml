name: RITHM 2.0 Human Route Group Verification
on:
  push:
    branches: [main, research/rithm-2.0-active]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python rithm20.py tests/fixtures/study1-mini.csv
      - run: git diff --exit-code && test -z "$(git status --porcelain)"
  base-r:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
      - run: Rscript R/check_study1.R tests/fixtures/study1-mini.csv
      - run: git diff --exit-code && test -z "$(git status --porcelain)"
# Read-only; tests on synthetic fixtures cannot certify original human-data statistics.
