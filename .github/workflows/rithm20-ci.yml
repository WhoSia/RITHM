name: RITHM route-group source/identification verification
on:
  push:
    branches: [main, research/rithm-2.0-active]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: 'src'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scientific test dependencies
        run: python -m pip install numpy pandas
      - run: python -m unittest discover -s tests -v
      - run: python -m rithm.legacy.rithm20 tests/fixtures/study1-mini.csv
      - run: git diff --exit-code && test -z "$(git status --porcelain)"
  base-r:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
      - run: Rscript R/check_study1.R tests/fixtures/study1-mini.csv
      - run: git diff --exit-code && test -z "$(git status --porcelain)"
# Synthetic tests/fixtures do not certify human causal or original-source claims.
