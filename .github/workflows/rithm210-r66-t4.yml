name: RITHM 2.10 R66-T4 Fixed-Frailty Equivalence (source-free)
on:
  push:
    paths:
      - 'ruby/rithm210/p3/r66_t4_frailty_equivalence.py'
      - 'ruby/rithm210/p3/test_r66_t4_frailty_equivalence.py'
      - '.github/workflows/rithm210-r66-t4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-frailty-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact rational theorem witness, no participant data
        working-directory: ruby/rithm210/p3
        run: |
          python -m unittest -v test_r66_t4_frailty_equivalence.py
          python r66_t4_frailty_equivalence.py
