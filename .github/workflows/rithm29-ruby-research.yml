          ruby test_shock_afterlife.rb
          ruby test_mixed_clock_chain.rb
          ruby test_mixed_clock_theorem.rb
          ruby test_mixed_clock_identification.rb
          ruby test_occupancy_equivalence.rb
          ruby test_independent_churn_moments.rb
