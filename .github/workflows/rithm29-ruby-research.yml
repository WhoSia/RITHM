          ruby test_original_welfare_audit.rb
          ruby test_welfare_probability.rb
          ruby test_welfare_bootstrap.rb
          ruby test_welfare_variance_bootstrap.rb
          ruby test_welfare_temporal_decomposition.rb
          ruby test_turnover_welfare_drift.rb
          ruby test_conditional_instability.rb
          ruby test_state_standardized_instability.rb
          ruby test_churn_welfare_bounds.rb
          ruby test_churn_session_bootstrap.rb
          ruby test_activity_event_cv.rb
          ruby test_ssm5_conditioned.rb
          ruby test_ssm_generative.rb
