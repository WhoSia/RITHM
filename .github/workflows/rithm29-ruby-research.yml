          ruby test_group_residual_source_cv.rb
          ruby test_epoch_independent_welfare.rb
          ruby test_joint_epoch_diagnostics.rb
          ruby test_occupancy_churn_bounds.rb
          ruby test_occupancy_churn_backcompat.rb
          ruby test_turnover_coupling_witness.rb
      - name: R23 source-free Python regression tests
        run: python3 -m unittest discover -s ruby/rithm210/p3 -p 'test_r23_*.py' -v
      - name: R24 source-free welfare identity and heldout-selection tests
        run: python3 -m unittest discover -s ruby/rithm210/p3 -p 'test_r24_*.py' -v
      - name: R25 source-free nested calibration, exact dependence controls and training-boundary tests
        run: python3 -m unittest discover -s ruby/rithm210/p3 -p 'test_r25_*.py' -v
      - name: Set up Python for R26 source-free synthetic tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install R26 vectorized test dependency
        run: python -m pip install 'numpy>=1.24,<3'
      - name: R26 independent-marginal latent shock and train-heldout boundary tests
        run: python -m unittest discover -s ruby/rithm210/p3 -p 'test_r26_*.py' -v
      - name: R27 source-free occupancy-fiber nonidentification proof tests
        run: python -m unittest discover -s ruby/rithm210/p3 -p 'test_r27_*.py' -v
      - name: R27-R2 source-free 448-state adaptive-feedback and heldout firewall tests
        run: python -m unittest discover -s ruby/rithm210/p3 -p 'test_r27_r2_*.py' -v
