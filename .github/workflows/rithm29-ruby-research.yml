          ruby test_r18_sign_reduction.rb
          ruby test_r18_truthful_signal_audit.rb
          ruby test_r18_round_chain_audit.rb
          ruby test_r18_design_feasibility.rb
          ruby test_r18_preanalysis_manifest.rb
          ruby test_r18_observable_age_support.rb
          ruby test_r18_age_support_bootstrap.rb
          ruby test_r19_partial_welfare.rb
          ruby test_r19_information_value.rb
          ruby test_r19_identification_phase.rb
          ruby test_r19_ssm_exact.rb
          ruby test_r19_ssm_source_benchmark.rb
          ruby test_r19_ssm_session_contrast.rb
          ruby test_r19_persistent_q_filter.rb
          ruby test_r19_persistent_q_source.rb
          ruby test_r20_group_bridge.rb
          ruby test_r20_session_contrast.rb
          ruby test_r21_ewa_group_cv.rb
          ruby test_r21_ewa_incremental_cv.rb
          ruby test_r22_ssm_exact_series.rb
          ruby test_r22_ssm_float_series.rb
          ruby test_r22_q9_session_contrast.rb
          ruby test_r23_actor_memory.rb
          ruby test_r23_group_memory_cv.rb
          ruby test_r23_group_folds.rb
          ruby test_update_clock_signal_factorial.rb
          ruby test_update_clock_welfare_rollout.rb
          ruby test_adaptation_cycle.rb
