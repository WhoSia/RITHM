name: RITHM 2.9–2.10 Ruby Research Tests
on:
  push:
    paths:
      - 'ruby/rithm29/learning/group_joint/ruby/**'
      - 'ruby/rithm210/**'
      - '.github/workflows/rithm29-ruby-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ruby-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Unit tests, not original-data replication
        run: |
          cd ruby/rithm29/learning/group_joint/ruby
          ruby test_actor_markov_joint.rb
          ruby test_residual_independence_audit.rb
          ruby test_empirical_group_baseline.rb
          ruby test_empirical_baseline_robustness.rb
          ruby test_session_weighted_bootstrap.rb
          cd ../../../../rithm210/p0
          ruby test_latent_common_shock.rb
          ruby test_joint_observational_equivalence.rb
          cd ../p1
          ruby test_latent_joint_cv.rb
          cd ../p2
          ruby test_residual_negative_control.rb
          ruby test_actor_calibration.rb
          ruby test_epoch_conditioned_model.rb
          ruby test_epoch_bootstrap.rb
          ruby test_epoch_residual_contrast.rb
          ruby test_group_local_identification.rb
          ruby test_local_shock_moment_audit.rb
          ruby test_nested_gamma_cv.rb
          ruby test_treatment_epoch_cv.rb
          ruby test_stratified_contrasts.rb
          ruby test_section_order_audit.rb
          ruby test_section_adjusted_regression.rb
          ruby test_online_actor_history.rb
          ruby test_nested_online_actor_cv.rb
          ruby test_longitudinal_identity_audit.rb
          ruby test_online_history_shock.rb
          cd ../p3
          ruby test_friction_welfare.rb
          ruby test_finite_horizon_independent_welfare.rb
          ruby test_finite_welfare_closed_form.rb
          ruby test_all_state_epoch_cv.rb
          ruby test_all_state_session_bootstrap.rb
          ruby test_full_info_route_gap_logit.rb
          ruby test_qi_model_a_transfer.rb
          ruby test_qi_model_a_paired_bootstrap.rb
          ruby test_qi_abc_transfer.rb
          ruby test_qi_abc_session_contrast.rb
          ruby test_qi_abc_forward_trajectory.rb
          ruby test_qi_abc_forward_bootstrap.rb
          ruby test_update_clock_signal_factorial.rb
          ruby test_update_clock_welfare_rollout.rb
          ruby test_factorial_session_randomization.rb
          ruby test_update_clock_sensitivity.rb
          ruby test_smooth_signal_clock.rb
          ruby test_smooth_clock_welfare_rollout.rb
