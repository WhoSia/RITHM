name: RITHM 2.9–2.10 Ruby Research Tests
on:
  push:
    paths:
      - 'ruby/rithm29/learning/group_joint/ruby/**'
      - 'ruby/rithm210/**'
      - '.github/workflows/rithm29-ruby-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ruby-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Unit tests, not original-data replication
        run: |
          cd ruby/rithm29/learning/group_joint/ruby
          ruby test_actor_markov_joint.rb
          ruby test_residual_independence_audit.rb
          ruby test_empirical_group_baseline.rb
          ruby test_empirical_baseline_robustness.rb
          ruby test_session_weighted_bootstrap.rb
          cd ../../../../rithm210/p0
          ruby test_latent_common_shock.rb
          ruby test_joint_observational_equivalence.rb
          cd ../p1
          ruby test_latent_joint_cv.rb
          cd ../p2
          ruby test_residual_negative_control.rb
          ruby test_actor_calibration.rb
          ruby test_epoch_conditioned_model.rb
          ruby test_epoch_bootstrap.rb
          ruby test_epoch_residual_contrast.rb
          ruby test_group_local_identification.rb
          ruby test_local_shock_moment_audit.rb
          ruby test_nested_gamma_cv.rb
          ruby test_treatment_epoch_cv.rb
          ruby test_stratified_contrasts.rb
          ruby test_section_order_audit.rb
          ruby test_section_adjusted_regression.rb
          ruby test_online_actor_history.rb
          ruby test_nested_online_actor_cv.rb
          ruby test_longitudinal_identity_audit.rb
          ruby test_online_history_shock.rb
          cd ../p3
          ruby test_friction_welfare.rb
          ruby test_adaptation_cycle.rb
          ruby test_policy_welfare_equivalence.rb
          ruby test_experimental_welfare.rb
          ruby test_original_welfare_audit.rb
          ruby test_welfare_probability.rb
          ruby test_welfare_bootstrap.rb
          ruby test_welfare_variance_bootstrap.rb
          ruby test_welfare_temporal_decomposition.rb
          ruby test_turnover_welfare_drift.rb
          ruby test_conditional_instability.rb
          ruby test_state_standardized_instability.rb
          ruby test_churn_welfare_bounds.rb
          ruby test_churn_session_bootstrap.rb
          ruby test_activity_event_cv.rb
          ruby test_ssm5_conditioned.rb
          ruby test_ssm_generative.rb
          ruby test_ssm_activity.rb
          ruby test_ssm_q_sensitivity.rb
          ruby test_ssm_table7_replication.rb
          ruby test_ssm_observed_activity_gap.rb
          ruby test_activity_mixture.rb
          ruby test_ssm_joint_falsifier.rb
          ruby test_ssm_activity_moments.rb
          ruby test_pairwise_welfare.rb
          ruby test_pairwise_source_audit.rb
          ruby test_atomic_nash_potential.rb
          ruby test_adjustment_clocks.rb
      - name: Research status boundary
        run: echo "PASS verifies synthetic/unit-level properties only; original data not present in CI."
