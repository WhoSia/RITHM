      - name: RITHM interim audit temporal filtration and session101 population test
        run: python -m unittest discover -s ruby/rithm210/p3 -p 'test_r27_audit_*.py' -v
      - name: Interim population contracts 24 vs 25 vs literal R 26 (source-free)
        run: python -m unittest discover -s ruby/rithm210/p3 -p 'test_r27_audit_population_contracts.py' -v
      - name: Install SciPy before any R28-R34 Python test imports
        run: python -m pip install 'scipy>=1.10,<2'
      - name: R28 source-free cohort CV and exact full-info cost-rank obstruction
        run: python -m unittest discover -s ruby/rithm210/p3 -p 'test_r28_*.py' -v
      - name: R28 lawful payoff and information-filtration tests
        run: python -m unittest discover -s ruby/rithm210/p3 -p 'test_r28_*.py' -v
      - name: R29 Partial-information source-free privacy and switching regressions
        run: python -m unittest discover -s ruby/rithm210/p3 -p 'test_r29_*.py' -v
      - name: R29 Partial information and micro-to-macro welfare source-free tests
        run: python -m unittest discover -s ruby/rithm210/p3 -p 'test_r29_*.py' -v
      - name: R30 source-free Partial legal signal and latent joint-score invariant regression
        run: python -m unittest discover -s ruby/rithm210/p3 -p 'test_r30_*.py' -v
      - name: R31 prior-segment order and experience future-information firewall tests
        run: python -m unittest discover -s ruby/rithm210/p3 -p 'test_r31_*.py' -v
      - name: R32 pre-Partial preference vs prior experience and hidden information source-free checks
        run: python -m unittest discover -s ruby/rithm210/p3 -p 'test_r32_*.py' -v
      - name: R33 online Partial payoff history and no-leak source-free tests
        run: python -m unittest discover -s ruby/rithm210/p3 -p 'test_r33_*.py' -v
      - name: R34 within-route received-payoff permutation and R30-R31 API bridge tests
        run: python -m unittest discover -s ruby/rithm210/p3 -p 'test_r34_*.py' -v
      - name: R35 value randomization predecision placebo and source-free contract tests
        run: python -m unittest discover -s ruby/rithm210/p3 -p 'test_r35_*.py' -v
      - name: R36 source-free conditional placebo and nonidentification guards
        run: python -m unittest discover -s ruby/rithm210/p3 -p 'test_r36_*.py' -v
      - name: R37 author EWA-lite, SSM5/SSM1-9 and nondegenerate negative-control source-free tests
        run: python -m unittest discover -s ruby/rithm210/p3 -p 'test_r37_*.py' -v
      - name: R38 matched forecasts and conditional permutation variance
        run: python -m unittest discover -s ruby/rithm210/p3 -p 'test_r38_*.py' -v
      - name: Research status boundary
        run: echo "PASS verifies synthetic/unit-level properties only; original data not present in CI."
