name: RITHM S02.14-E4 exact-E3-binary uninterrupted TNEG

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frame:
    name: Reconstruct frozen S02.14 frame from exact MoST source bytes
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact MoST demand authority
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/lcodeca/MoSTScenario.git most-source
          git -C most-source checkout --detach b29b2f65f1096a9c69a601ec62a724815cb4a43f
          test "$(git -C most-source rev-parse HEAD)" = 'b29b2f65f1096a9c69a601ec62a724815cb4a43f'
          test "$(git -C most-source hash-object scenario/in/route/most.buses.flows.xml)" = 'd40c61978b3905d26fba2fc34ad589e22372d255'
          test "$(git -C most-source hash-object scenario/in/route/most.commercial.rou.xml)" = '8395d7c3b4239b1d0c0ab7fb53ee1d1e6f5627a1'
          test "$(git -C most-source hash-object scenario/in/route/most.highway.flows.xml)" = '4de691732a3422125789c5de465af26e76a8247d'
          test "$(git -C most-source hash-object scenario/in/route/most.pedestrian.rou.xml)" = '8207662a58ceccd932fd11715ffdae7df39dec25'
          test "$(git -C most-source hash-object scenario/in/route/most.special.rou.xml)" = '4cc76e02bb462551f191c0ad4c325a28d17bdf50'
          test "$(git -C most-source hash-object scenario/in/route/most.trains.flows.xml)" = '9888bea419cd8c78350380786df0c1dcbeb2062c'
          mkdir demand
          cp most-source/scenario/in/route/{most.buses.flows.xml,most.commercial.rou.xml,most.highway.flows.xml,most.pedestrian.rou.xml,most.special.rou.xml,most.trains.flows.xml} demand/

      - name: Reconstruct and verify exact frozen frame/cohorts
        run: |
          set -euo pipefail
          python scripts/s02_14_compile_frame.py --demand-dir demand --out-dir seal
          test "$(sha256sum seal/s02-14-demand-frame.tsv | cut -d' ' -f1)" = 'ad718af789d1402b2d809bbf0c0fa2b5786c71675a4c81ebf91bcd03a957022d'
          test "$(sha256sum seal/s02-14-eligible-frame.tsv | cut -d' ' -f1)" = 'e62c94e400e4e868c8ec2d3f734801c56dd0ba03fa2c050f32e223e876c43293'
          test "$(sha256sum seal/s02-14-p000-explicit.txt | cut -d' ' -f1)" = 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
          test "$(sha256sum seal/s02-14-p030-explicit.txt | cut -d' ' -f1)" = '1b9fba0675825b770afe24159fc39c4ba12b6f78fa05e432d77ad8e7556f83f5'
          test "$(sha256sum seal/s02-14-p070-explicit.txt | cut -d' ' -f1)" = 'f4855d4965e9d7268f97a2d0c90f11b4d9632cd6cd8d22ff2d15ed4804cd9270'
          test "$(sha256sum seal/s02-14-p100-explicit.txt | cut -d' ' -f1)" = '21d0db278e7c39d9403520b10ab471470a03c30cd908c587677a1d5249f8f634'

      - name: Upload frozen frame receipt
        uses: actions/upload-artifact@v4
        with:
          name: s02-14-e4-frozen-frame
          path: seal/
          if-no-files-found: error
          retention-days: 90

  cell:
    name: E4-TNEG-p${{ matrix.label }}
    needs: frame
    runs-on: [self-hosted, linux, x64, rithm-e4]
    timeout-minutes: 900
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: '000'
            cohort_file: s02-14-p000-explicit.txt
            cohort_sha: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
            cohort_n: 0
          - label: '030'
            cohort_file: s02-14-p030-explicit.txt
            cohort_sha: 1b9fba0675825b770afe24159fc39c4ba12b6f78fa05e432d77ad8e7556f83f5
            cohort_n: 13746
          - label: '070'
            cohort_file: s02-14-p070-explicit.txt
            cohort_sha: f4855d4965e9d7268f97a2d0c90f11b4d9632cd6cd8d22ff2d15ed4804cd9270
            cohort_n: 32075
          - label: '100'
            cohort_file: s02-14-p100-explicit.txt
            cohort_sha: 21d0db278e7c39d9403520b10ab471470a03c30cd908c587677a1d5249f8f634
            cohort_n: 45822

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Clean persistent self-hosted workspace residues
        run: |
          set -euo pipefail
          rm -rf runtime seal most most-source demand
          rm -f e4-p*.json e4-p*.tsv e4-p*.txt e4-p*.sha256 cell-sumo-version.txt

      - name: Environment constitution and host receipt
        run: |
          set -euo pipefail
          source /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = '22.04'
          test "$(uname -m)" = 'x86_64'
          {
            echo "stage=RITHM-ORIGIN-S02.14-E4"
            echo "label=${{ matrix.label }}"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "uname=$(uname -a)"
            echo "os_pretty=$PRETTY_NAME"
            echo "cpu_model=$(lscpu | awk -F: '/Model name/{gsub(/^[ \t]+/,"",$2); print $2; exit}')"
            echo "logical_cpu=$(nproc)"
            echo "memory=$(free -h | awk '/Mem:/{print $2}')"
            echo "disk=$(df -h "$GITHUB_WORKSPACE" | tail -1)"
            echo "workflow_sha=$GITHUB_SHA"
          } | tee e4-p${{ matrix.label }}-environment.txt

      - name: Download exact E3 SUMO runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: s02-14-e3-sumo114-gdal-runtime
          path: runtime
          github-token: ${{ github.token }}
          repository: WhoSia/RITHM
          run-id: 35307642604

      - name: Download fresh E4 frozen frame receipt
        uses: actions/download-artifact@v4
        with:
          name: s02-14-e4-frozen-frame
          path: seal

      - name: Verify exact E3 binary and frozen frame/cohort
        run: |
          set -euo pipefail
          chmod +x runtime/bin/sumo
          test "$(sha256sum runtime/bin/sumo | cut -d' ' -f1)" = '75c5556e52dd48953a7b6b75c3bb508df89a1e5690f7e32c962eac4587da864b'
          export SUMO_HOME="$PWD/runtime"
          runtime/bin/sumo --version | tee cell-sumo-version.txt
          grep -Eiq 'Version[[:space:]]+1\.14\.0([^0-9]|$)' cell-sumo-version.txt
          grep -Eq 'GDAL' cell-sumo-version.txt
          ldd runtime/bin/sumo | tee e4-p${{ matrix.label }}-ldd.txt
          ! grep -q 'not found' e4-p${{ matrix.label }}-ldd.txt
          test "$(sha256sum seal/s02-14-eligible-frame.tsv | cut -d' ' -f1)" = 'e62c94e400e4e868c8ec2d3f734801c56dd0ba03fa2c050f32e223e876c43293'
          test "$(sha256sum seal/${{ matrix.cohort_file }} | cut -d' ' -f1)" = '${{ matrix.cohort_sha }}'
          python - <<'PY'
          import csv
          with open('seal/s02-14-eligible-frame.tsv',newline='') as f:
              rows=list(csv.DictReader(f,delimiter='\t'))
          assert len(rows)==45822 and len({r['id'] for r in rows})==45822
          PY

      - name: Checkout exact MoST commit
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/lcodeca/MoSTScenario.git most
          git -C most checkout --detach b29b2f65f1096a9c69a601ec62a724815cb4a43f
          test "$(git -C most rev-parse HEAD)" = 'b29b2f65f1096a9c69a601ec62a724815cb4a43f'
          test "$(git -C most hash-object scenario/most.sumocfg)" = '03dbc535acd7057731a1de8924115a9276842426'
          test "$(git -C most hash-object scenario/in/most.net.xml)" = '6ffae75cfe63992c04a6395fbbe86cc39166140c'
          test "$(git -C most hash-object scenario/in/add/basic.vType.xml)" = 'd9aebbde5cfeb8dbee6203d6c5fdf3b1f4666a21'

      - name: Materialize unchanged frozen E3 TNEG config under E4 custody
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET, hashlib, json
          label='${{ matrix.label }}'
          cohort=[x for x in Path('seal/${{ matrix.cohort_file }}').read_text().splitlines() if x]
          assert len(cohort)==${{ matrix.cohort_n }} and len(set(cohort))==${{ matrix.cohort_n }}

          tree=ET.parse('most/scenario/most.sumocfg')
          root=tree.getroot()
          routing=root.find('routing')
          out=root.find('output')
          proc=root.find('processing')
          time=root.find('time')
          rnd=root.find('random_number')
          assert all(x is not None for x in [routing,out,proc,time,rnd])
          assert out.find('output-prefix').get('value')=='most.'
          assert float(proc.find('max-depart-delay').get('value'))==900.0
          assert float(time.find('begin').get('value'))==14400.0
          assert float(time.find('end').get('value'))==50400.0
          assert float(time.find('step-length').get('value'))==0.25
          assert int(rnd.find('seed').get('value'))==42

          def setv(parent,name,value):
              e=parent.find(name)
              if e is None:
                  e=ET.SubElement(parent,name)
              e.set('value',str(value))

          setv(routing,'device.rerouting.probability','0')
          setv(routing,'device.rerouting.period','300')
          setv(routing,'device.rerouting.pre-period','300')
          old=routing.find('device.rerouting.explicit')
          if old is not None:
              routing.remove(old)
          if cohort:
              e=ET.SubElement(routing,'device.rerouting.explicit')
              e.set('value',','.join(cohort))

          setv(proc,'time-to-teleport','-1')
          setv(out,'tripinfo-output',f'e4-p{label}-tripinfo.xml')
          setv(out,'tripinfo-output.write-unfinished','true')

          cfg=Path(f'most/scenario/e4-p{label}.sumocfg')
          tree.write(cfg,encoding='utf-8',xml_declaration=True)
          receipt={
              'stage':'RITHM-ORIGIN-S02.14-E4',
              'label':label,
              'cohort_n':len(cohort),
              'global_probability':0,
              'period':300,
              'pre_period':300,
              'time_to_teleport':-1,
              'max_depart_delay':900,
              'begin':14400,
              'end':50400,
              'step':0.25,
              'seed':42,
              'output_prefix':'most.',
              'tripinfo_configured_name':f'e4-p{label}-tripinfo.xml',
              'tripinfo_expected_realized_name':f'most.e4-p{label}-tripinfo.xml',
              'tripinfo_write_unfinished':True,
              'config_sha256':hashlib.sha256(cfg.read_bytes()).hexdigest(),
              'sumo_binary_sha256':'75c5556e52dd48953a7b6b75c3bb508df89a1e5690f7e32c962eac4587da864b',
              'execution_mode':'single uninterrupted process from begin to end',
              'checkpoint_or_load_state_allowed':False,
              'job_ceiling_minutes':900,
              'target_outcome_read_before_execution':False,
              'e3_partial_output_reuse':False,
          }
          Path(f'e4-p{label}-config-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Exact parser round-trip and constitution gate
        working-directory: most/scenario
        env:
          SUMO_HOME: ${{ github.workspace }}/runtime
        run: |
          set -euo pipefail
          ../../runtime/bin/sumo -c e4-p${{ matrix.label }}.sumocfg -C e4-p${{ matrix.label }}.roundtrip.sumocfg
          test -s e4-p${{ matrix.label }}.roundtrip.sumocfg
          python - <<'PY'
          import xml.etree.ElementTree as ET
          label='${{ matrix.label }}'
          root=ET.parse(f'e4-p{label}.roundtrip.sumocfg').getroot()
          out=root.find('output')
          proc=root.find('processing')
          routing=root.find('routing')
          time=root.find('time')
          rnd=root.find('random_number')
          assert out.find('output-prefix').get('value')=='most.'
          assert out.find('tripinfo-output').get('value')==f'e4-p{label}-tripinfo.xml'
          assert out.find('tripinfo-output.write-unfinished').get('value').lower()=='true'
          assert float(proc.find('time-to-teleport').get('value'))==-1.0
          assert float(proc.find('max-depart-delay').get('value'))==900.0
          assert float(routing.find('device.rerouting.probability').get('value'))==0.0
          assert float(routing.find('device.rerouting.period').get('value'))==300.0
          assert float(routing.find('device.rerouting.pre-period').get('value'))==300.0
          assert float(time.find('begin').get('value'))==14400.0
          assert float(time.find('end').get('value'))==50400.0
          assert float(time.find('step-length').get('value'))==0.25
          assert int(rnd.find('seed').get('value'))==42
          explicit=routing.find('device.rerouting.explicit')
          expected=${{ matrix.cohort_n }}
          if expected==0:
              assert explicit is None or not explicit.get('value','')
          else:
              assert explicit is not None
              assert len([x for x in explicit.get('value','').split(',') if x])==expected
          PY

      - name: Execute frozen E4 TNEG cell uninterrupted
        id: execute
        working-directory: most/scenario
        env:
          SUMO_HOME: ${{ github.workspace }}/runtime
        run: |
          set +e
          start_epoch=$(date +%s)
          ../../runtime/bin/sumo -c e4-p${{ matrix.label }}.sumocfg --no-step-log true > e4-p${{ matrix.label }}.stdout.txt 2> e4-p${{ matrix.label }}.stderr.txt
          rc=$?
          end_epoch=$(date +%s)
          echo "$rc" > e4-p${{ matrix.label }}.exitcode.txt
          echo "$start_epoch $end_epoch $((end_epoch-start_epoch))" > e4-p${{ matrix.label }}.runtime-seconds.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prefix-aware complete TripInfo custody gate
        id: custody
        if: ${{ steps.execute.outputs.rc == '0' }}
        run: |
          set -euo pipefail
          test -s most/scenario/most.e4-p${{ matrix.label }}-tripinfo.xml
          sha256sum most/scenario/most.e4-p${{ matrix.label }}-tripinfo.xml > e4-p${{ matrix.label }}-tripinfo.sha256
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Materialize exact 45822-row frame-complete burden receipt without cell mean
        if: ${{ steps.custody.outputs.ok == 'true' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv, math, xml.etree.ElementTree as ET
          label='${{ matrix.label }}'
          H=50400.0
          frame={}
          with open('seal/s02-14-eligible-frame.tsv',newline='') as f:
              for row in csv.DictReader(f,delimiter='\t'):
                  frame[row['id']]=float(row['activation_time'])
          assert len(frame)==45822
          trip=Path(f'most/scenario/most.e4-p{label}-tripinfo.xml')
          assert trip.exists() and trip.stat().st_size>0
          arrivals={}
          duplicates=[]
          for _,e in ET.iterparse(trip,events=('end',)):
              if e.tag.split('}')[-1]!='tripinfo':
                  e.clear()
                  continue
              vid=e.attrib.get('id')
              if vid not in frame:
                  e.clear()
                  continue
              if vid in arrivals:
                  duplicates.append(vid)
              try:
                  a=float(e.attrib.get('arrival','-1'))
              except Exception:
                  a=-1.0
              arrivals[vid]=a if math.isfinite(a) and 0<=a<=H else H
              e.clear()
          assert not duplicates, duplicates[:20]
          with open(f'e4-p{label}-framecomplete.tsv','w',newline='') as f:
              w=csv.writer(f,delimiter='\t')
              w.writerow(['id','activation_time','completion_clock','burden','status'])
              for vid,s in frame.items():
                  if vid in arrivals:
                      A=arrivals[vid]
                      status='materialized'
                  else:
                      A=H
                      status='absent'
                  b=A-s
                  assert b>=-1e-9
                  w.writerow([vid,s,A,b,status])
          PY
          test "$(($(wc -l < e4-p${{ matrix.label }}-framecomplete.tsv)-1))" = '45822'

      - name: Seal E4 cell status
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          label='${{ matrix.label }}'
          ep=Path(f'most/scenario/e4-p{label}.exitcode.txt')
          rc=int(ep.read_text().strip()) if ep.exists() else None
          trip=Path(f'most/scenario/most.e4-p{label}-tripinfo.xml')
          frame=Path(f'e4-p{label}-framecomplete.tsv')
          rt=Path(f'most/scenario/e4-p{label}.runtime-seconds.txt')
          out={
              'stage':'RITHM-ORIGIN-S02.14-E4',
              'label':label,
              'exit_code':rc,
              'simulation_success':rc==0,
              'prefixed_tripinfo_custodied':trip.exists() and trip.stat().st_size>0,
              'framecomplete_materialized':frame.exists() and frame.stat().st_size>0,
              'scientific_cell_receipt_valid':rc==0 and trip.exists() and trip.stat().st_size>0 and frame.exists() and frame.stat().st_size>0,
              'cell_mean_computed':False,
              'target_curvature_scored':False,
              'execution_mode':'single uninterrupted process',
              'job_ceiling_minutes':900,
              'checkpoint_or_load_state_used':False,
              'timeout_is_gridlock_evidence':False,
              'sumo_binary_sha256':'75c5556e52dd48953a7b6b75c3bb508df89a1e5690f7e32c962eac4587da864b',
          }
          if rt.exists():
              parts=rt.read_text().split()
              if len(parts)==3:
                  out['runtime_seconds']=int(parts[2])
          if trip.exists():
              out['tripinfo_sha256']=hashlib.sha256(trip.read_bytes()).hexdigest()
          Path(f'e4-p{label}-status.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Upload E4 cell receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s02-14-e4-p${{ matrix.label }}
          path: |
            cell-sumo-version.txt
            e4-p${{ matrix.label }}-environment.txt
            e4-p${{ matrix.label }}-ldd.txt
            e4-p${{ matrix.label }}-config-receipt.json
            e4-p${{ matrix.label }}-status.json
            e4-p${{ matrix.label }}-framecomplete.tsv
            e4-p${{ matrix.label }}-tripinfo.sha256
            most/scenario/e4-p${{ matrix.label }}.roundtrip.sumocfg
            most/scenario/e4-p${{ matrix.label }}.exitcode.txt
            most/scenario/e4-p${{ matrix.label }}.runtime-seconds.txt
            most/scenario/e4-p${{ matrix.label }}.stdout.txt
            most/scenario/e4-p${{ matrix.label }}.stderr.txt
            most/scenario/most.e4-p${{ matrix.label }}-tripinfo.xml
          if-no-files-found: warn
          retention-days: 90

      - name: Fail cell only after custody
        if: always()
        run: |
          test -f most/scenario/e4-p${{ matrix.label }}.exitcode.txt
          test "$(cat most/scenario/e4-p${{ matrix.label }}.exitcode.txt)" = '0'
          test -s most/scenario/most.e4-p${{ matrix.label }}-tripinfo.xml
          test -s e4-p${{ matrix.label }}-framecomplete.tsv

  score:
    name: Complete-set E4 TNEG curvature and teleport-regularization closure
    needs: cell
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Download all available fresh E4 cell receipts
        uses: actions/download-artifact@v4
        with:
          pattern: s02-14-e4-p*
          path: cells
          merge-multiple: false

      - name: Complete-set admission before target aggregation
        id: admission
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, os
          labels=['000','030','070','100']
          statuses={}
          ok=True
          for label in labels:
              d=Path('cells')/f's02-14-e4-p{label}'
              sp=d/f'e4-p{label}-status.json'
              if not sp.exists():
                  statuses[label]={'scientific_cell_receipt_valid':False,'reason':'missing-status-or-artifact'}
                  ok=False
                  continue
              statuses[label]=json.loads(sp.read_text())
              fp=d/f'e4-p{label}-framecomplete.tsv'
              tp=d/'most'/'scenario'/f'most.e4-p{label}-tripinfo.xml'
              if not statuses[label].get('scientific_cell_receipt_valid') or not fp.exists() or not tp.exists():
                  ok=False
          out={
              'stage':'RITHM-ORIGIN-S02.14-E4',
              'all_four_fresh_e4_cells_valid':ok,
              'target_aggregation_permitted':ok,
              'statuses':statuses,
              'e3_partial_output_reuse':False,
              'checkpoint_stitching_used':False,
              'timeout_is_gridlock_evidence':False,
          }
          Path('e4-admission.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"ok={'true' if ok else 'false'}\n")
          PY

      - name: Apply frozen TNEG decision and closure
        if: ${{ steps.admission.outputs.ok == 'true' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv, json
          labels=['000','030','070','100']
          B={}
          counts={}
          for label in labels:
              fp=Path('cells')/f's02-14-e4-p{label}'/f'e4-p{label}-framecomplete.tsv'
              total=0.0
              n=0
              materialized=0
              absent=0
              with fp.open(newline='') as f:
                  for row in csv.DictReader(f,delimiter='\t'):
                      total+=float(row['burden'])
                      n+=1
                      if row['status']=='materialized':
                          materialized+=1
                      elif row['status']=='absent':
                          absent+=1
              assert n==45822
              B[label]=total/45822
              counts[label]={'materialized_n':materialized,'absent_n':absent,'frame_n':n}
          B0=B['000']
          assert B0>0
          R={k:B[k]/B0-1 for k in labels}
          C=(R['100']-R['070'])-(R['030']-R['000'])
          eps=.005
          if C>eps:
              tneg_verdict='PASS-TNEG-CURVATURE'
              closure='PASS-TELEPORT-ROBUST'
          elif C<-eps:
              tneg_verdict='DEFEAT-TNEG-CURVATURE'
              closure='REGULARIZATION-SENSITIVE'
          else:
              tneg_verdict='UNRESOLVED-TNEG-CURVATURE'
              closure='REGULARIZATION-SENSITIVE'
          out={
              'stage':'RITHM-ORIGIN-S02.14-E4',
              'scientific_target_observed':True,
              'B_NEG':B,
              'R_B_NEG':R,
